<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Felipe Salgado">
    <meta name="description" content="Site da empresa DevConnect">

    <title>Tela Cadastro - DevConnect</title>

    <link rel="shortcut icon" href="../assets/images/logo-devconnectnova-md.svg" type="image/x-icon">

    <!-- CSS -->
    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="../styles/cadastro.css">
</head>

<body>

    <main>
        <div>

            <!-- FORMULÁRIO -->
            <form class="estilo-formulario">

                <img src="../assets/images/logo-devconnectnovo-lg.svg" alt="Logo DevConnect">

                <p>Cadastre-se para a comunidade exclusiva de desenvolvedores(as)</p>

                <div class="formulario-campos">
                    <input type="text" placeholder="Nome e sobrenome">
                </div>

                <div class="formulario-campos">
                    <input type="text" placeholder="Nome de usuário">
                </div>

                <div class="formulario-campos">
                    <input type="email" placeholder="E-mail">
                </div>

                <div class="formulario-campos">
                    <input type="password" placeholder="Senha">
                </div>

                <div id="upload">
                    <label for="campo-upload">Faça upload da sua imagem...</label>
                    <input type="file" id="campo-upload">
                </div>

                <button type="submit" class="formulario-botao-azul">Cadastre-se</button>

                <p>Ao se cadastrar, você concorda com nossos Termos, Política de dados e Política de cookies.</p>

            </form>

            <!-- BLOCO INFERIOR -->
            <section id="secao-cadastro" class="estilo-formulario">
                <p>Tem uma conta? <a href="index.html">Conecte-se</a></p>
            </section>

            <p>Obtenha o aplicativo</p>

            <section id="secao-instalacao">
                <img src="../assets/images/app-store.svg" alt="App Store">
                <img src="../assets/images/google-play.svg" alt="Google Play">
            </section>

        </div>
    </main>

</body>

</html>
